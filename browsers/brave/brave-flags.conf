# Run under XWayland, not native Wayland. Chromium's Wayland backend segfaults
# when the output its window is on goes away: unplugging DP-1 with the lid shut
# took Brave, Chromium and Signal down together, six times in one week. XWayland
# absorbs the output change itself. The cost: blurrier text at fractional scale.
# See browsers/README.md, "Why XWayland".
--ozone-platform=x11
