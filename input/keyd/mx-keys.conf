# mx-keys.conf -- the MX Keys screenshot key, turned back into Print.
#
# The key where PrtSc belongs on an MX Keys does not send PrtSc. Its firmware
# sends the Windows snipping-tool chord -- SUPER+SHIFT+S -- and there is no
# setting on this side of the wireless link that changes that: Logi Options+
# does not exist on Linux, and Solaar cannot retarget this key either. So the
# chord is caught below the compositor instead, and Hyprland is handed the
# KEY_SYSRQ it was expecting all along -- so the `Print` bind that was already
# in conf/binds.lua answers the key that is labelled with it.
#
# [meta+shift] is a *composite* layer, and that is the whole reason keyd is here
# rather than a Hyprland bind on the chord. A binding on a composite layer emits
# its key WITHOUT the modifiers that activated the layer, so this produces a
# bare Print rather than SUPER+SHIFT+Print. A Hyprland bind cannot do that; it
# can only add a third meaning to a chord that already has two, and one of the
# two fires anyway (see the decision doc).
#
# What this was measured against, because it may well be the only keyboard it is
# true of: an *MX Keys S* (WPID B378, HID++ 4.5, firmware RBK 81.01.B0015) on a
# Logi Bolt receiver, with MULTIPLATFORM already set to Linux. `solaar show`
# calls the key control 14, "Screen Capture", default action "Snipping Tool".
# Another Logitech keyboard may send something else entirely from the key in that
# position, so treat the chord below as this device's behaviour rather than the
# family's -- and see the decision doc for why Solaar cannot change it.
#
# The id is the receiver, not the keyboard, and it is a keyboard-only match (k:)
# because the same 046d:c548 is also the mouse -- keyd's mouse support is
# documented as experimental, and grabbing a pointer by accident is how you lose
# the pointer. `sudo keyd monitor` prints the id of whatever you press: a second
# machine, or this keyboard paired over Bluetooth instead of through the
# receiver, is another line in this section.
#
# Two consequences, both deliberate, both aliased in conf/binds.lua:
#
#   SUPER+SHIFT+S on THIS keyboard is now Print, so it can no longer send a
#   window to the scratchpad -> SUPER+ALT+S does that, from any keyboard.
#
#   SUPER+Print cannot come from this key at all. SUPER is one of the three
#   keycodes the key itself presses, and this layer strips it; there is no way to
#   hold a second SUPER on top of the one the firmware is already sending. CTRL
#   is not part of the layer and survives it, so CTRL+Print is the fullscreen
#   half of the pair here.
#
# The laptop's built-in keyboard is not matched by the ids above and still has
# SUPER+SHIFT+S and SUPER+Print in their usual meanings.
#
# See docs/decisions/020-the-print-key-is-remapped-below-hyprland.md.

[ids]
k:046d:c548

[meta+shift]
s = sysrq
