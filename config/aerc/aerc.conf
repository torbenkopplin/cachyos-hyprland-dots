# aerc.conf -- aerc's own settings. The account lives in accounts.conf, which
# is NOT tracked: see accounts.conf.example next to this file.
#
# Why this file exists at all, when almost every value below is the shipped
# default: aerc does not merge configs. It uses the FIRST aerc.conf it finds --
# ~/.config/aerc, then the XDG dirs, then /usr/share/aerc/aerc.conf -- so the
# moment this file exists it DISPLACES the packaged one rather than layering on
# top of it. Anything the packaged file set and this one does not is simply
# gone. [filters] is entirely a creature of that packaged file, so it is
# repeated here verbatim; delete the block and every message body renders raw.

[general]
# unsafe-accounts-conf is left at its default of false on purpose. It is what
# makes aerc refuse to start when accounts.conf is readable by anyone but you,
# and since that file names a credential command -- and, in the plaintext
# variant, a password -- the refusal is the point. If aerc exits complaining
# about permissions, the fix is `chmod 600 ~/.config/aerc/accounts.conf`, not
# this setting.

[compose]
# What answers ":attach -m". Without it, attaching means typing a full path by
# hand; with it, ":attach -m" opens a fuzzy multi-select over the files in the
# directory aerc was started from, and every file picked is attached at once.
# fzf is already installed (packages.tsv, `dev`), and %s carries whatever was
# typed after -m straight into the query, so ":attach -m invoice" opens the
# picker already narrowed.
#
# Tab completion on a plain ":attach <path>" still works and is better for a
# single file whose name you know. This is for the other case.
file-picker-cmd=fzf --multi --query=%s

[filters]
# Verbatim from /usr/share/aerc/aerc.conf. Read the header above before
# trimming anything here.
#
# text/html is the line that matters most and the one most likely to look
# broken: the `html` filter is a wrapper around w3m, so with w3m missing the
# most common kind of mail in existence renders as nothing at all. w3m is in
# packages.tsv (`apps`) and tests/deps.tsv for exactly that reason.
text/plain=colorize
text/calendar=calendar
message/delivery-status=colorize
message/rfc822=colorize
text/html=! html
.headers=colorize
