# Frosted glass, read by bin/noct-glass.
#
# This is not a Noctalia config file -- Noctalia only auto-loads *.toml from
# this directory, so a .conf here is invisible to it. It lives beside the
# palettes because that is what it is keyed on.
#
# What you actually see
# ---------------------
# A translucent window composites as
#
#   seen = own colour x opacity + backdrop x (1 - opacity)
#
# so the frosted effect is worth exactly
#
#   lift = (backdrop - own colour) x (1 - opacity)
#
# and BOTH halves have to be right. This was got wrong once in each direction:
# an opacity of 0.82 with the blur dimmed to brightness 0.65 measured a lift of
# 3 levels out of 255 -- present in the config, absent on the screen, and the
# windows read as grey squares. `noct-check glass-visible` measures the number
# rather than arguing about it; it wants at least 12.
#
# The levels
# ----------
# Both are stated as what you SEE, where 1.0 is fully opaque:
#
#   window    every window, applied by the compositor
#             (decoration.active_opacity). This is what frosts GTK and Qt apps,
#             which draw an opaque background and offer no way not to. The cost
#             is that the compositor cannot tell a window's text from its
#             background, so text fades with it.
#
#   terminal  how opaque a terminal ends up. kitty is the one window that can
#             be translucent by itself, and its opacity multiplies with the
#             compositor's -- so noct-glass writes terminal / window into
#             kitty's background_opacity rather than `terminal` itself, and the
#             number you set here is the one you get.
#
# There is no `browser`. A browser is a window and gets `window`, like every
# other app that paints its own background opaque. Zen can be made to draw its
# page area transparent -- the "transparent zen" mod plus the "Zen Internet"
# extension -- and this file used to carry a third level that tinted what those
# left transparent. That was given up on 2026-08-19: see docs/theming.md.
#
# `terminal` sits WELL BELOW `window`, and that is the whole shape of this file.
#
# The compositor cannot tell a window's glyphs from its background, so `window`
# fades both. kitty's own background_opacity fades only the background and
# leaves the text at full strength. So every step of glassiness taken through
# `window` costs contrast, and every step taken through `terminal` costs
# nothing. Measured 2026-08-19 with `noct-check glass-legible`: driving a
# terminal entirely from the compositor at 0.60 left the ink at 78% of the
# scheme's foreground and looked washed out at a perfectly legal 5.3:1. The same
# visible glassiness supplied by kitty leaves it at 90%.
#
# The rule that follows: put `window` as high as the apps that CANNOT help
# themselves need -- GTK and Qt draw an opaque background and have no opacity of
# their own, so the compositor is the only thing that can frost them -- and take
# the rest out of `terminal`.
#
# This was the other way round until 2026-08-19, and for a real reason that has
# since gone away: kitty read background_opacity once at startup, so a
# terminal-specific level left you with two shades of terminal until the last
# old window was closed. `dynamic_background_opacity yes` in kitty.conf fixes
# that, and `noct-check kitty-live` is the test that it still does.
#
# What it costs: a GTK app at `window` is less glassy than a terminal at
# `terminal`, and they no longer match exactly. That is the "as much as
# feasible" in "everything matching" -- there is no way to give an app that
# draws itself opaque any translucency except by fading its text too.
#
# `terminal` cannot go above `window`: nothing can be more opaque than the
# compositor already makes it.
#
# Set `window` to 1.0 for app-translucency only: nothing fades except surfaces
# the app itself draws translucent, and `terminal` then reaches kitty
# unmodified.
#
# Keys are "<kind>:<name>" exactly as `noctalia msg color-scheme-get` prints
# them; anything unlisted uses the defaults.

window   = 0.85
terminal = 0.55

# --- the blur ---------------------------------------------------------------
#
# The other half of the lift. These reach Hyprland's decoration.blur through the
# same generated file as the levels, so the whole effect is described in one
# place.
#
#   blur_size, blur_passes   whether the wallpaper arrives as SHAPE or as a flat
#       wash. This is the setting that decides whether a window reads as glass
#       or as paint, and it is not about brightness at all. Around size 32 /
#       passes 4 the blur averages the image away: measured, the backdrop's
#       spatial variation fell to 20 levels, which after a 0.9 opacity reached
#       the eye as 2. At size 8 / passes 2 the photo's structure survives, which
#       is what "I can see a general idea of the wallpaper" means.
#
#       The trade is real and it is the one this setting used to be tuned for:
#       the more shape survives, the more two windows over different parts of
#       the image read as different shades. Flat makes every window identical
#       and makes them all look opaque. There is no value that does both.
#
#   blur_brightness   scales the backdrop directly, so it scales the lift
#       directly. At 0.65 this wallpaper (mean luma 99) arrived at 60, which
#       against a window whose own colour is 29 left 30 levels to divide by
#       opacity. At 1.0 it arrives near 95 and there is twice as much to see.
#
#   blur_vibrancy   how much colour survives. 0.05 is greyscale in practice;
#       the wallpaper's colour is most of what tells you there is a photo back
#       there rather than a grey gradient.
#
# Every one of these can be overridden per scheme with the same
# "<kind>:<name>.<key>" prefix as the levels.
blur_size       = 8
blur_passes     = 2
blur_brightness = 1.00
blur_contrast   = 1.0
blur_vibrancy   = 0.15

#   blur_xray   whether a window blurs the WALLPAPER (true) or whatever is
#       actually beneath it (false). Off, so that floating windows stack: a
#       floating terminal over another window samples that window and comes out
#       darker, which is what being in front should look like. Tiled windows are
#       unaffected either way, because columns do not overlap and the thing
#       beneath one of them is the wallpaper regardless.
#
#       This cannot be done per-window: Hyprland accepts `xray` as a window rule
#       and ignores it -- it is a layer rule. See conf/rules.lua.
blur_xray       = false

# --- per-scheme overrides ---------------------------------------------------
#
# Wallpaper-derived palettes are the ones actually designed to sit on an image,
# so they can afford a little more. Both move together, keeping the same
# relationship as the defaults above.
wallpaper:m3-tonal-spot.window   = 0.78
wallpaper:m3-tonal-spot.terminal = 0.78

# Light schemes need more opacity than dark ones: dark text on a translucent
# light background loses contrast much faster than the reverse -- and they need
# the backdrop dimmed rather than brightened, which is the one case for moving
# blur_brightness per scheme.
# builtin:Catppuccin.window          = 0.90
# builtin:Catppuccin.terminal        = 0.90
# builtin:Catppuccin.blur_brightness = 0.75
