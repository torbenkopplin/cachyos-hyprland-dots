# Frosted glass levels, read by bin/noct-glass.
#
# This is not a Noctalia config file -- Noctalia only auto-loads *.toml from
# this directory, so a .conf here is invisible to it. It lives beside the
# palettes because that is what it is keyed on.
#
# Two knobs. Both are stated as what you SEE, where 1.0 is fully opaque:
#
#   window    every window, applied by the compositor
#             (decoration.active_opacity). This is what frosts GTK and Qt apps,
#             which draw an opaque background and offer no way not to. The cost
#             is that the compositor cannot tell a window's text from its
#             background, so text fades with it.
#
#   terminal  how opaque a terminal ends up. kitty is the one window that can
#             be translucent by itself, and its opacity multiplies with the
#             compositor's -- so noct-glass writes terminal / window into
#             kitty's background_opacity rather than `terminal` itself, and the
#             number you set here is the one you get.
#
#   browser   how opaque a browser page ends up. Zen with the transparency mod is
#             the other window that draws its own translucency: its page area is
#             transparent, so what you see there is the blurred wallpaper at full
#             strength unless something tints it. noct-glass writes browser /
#             window into a stylesheet in the Zen profile, the same division it
#             does for kitty. See bin/noct-glass and browsers/zen/.
#
# `terminal` is kept EQUAL to `window` here, and that is a measurement rather than
# a preference: kitty applies background_opacity only at startup. It re-reads
# colours on SIGUSR1 but not this, so a terminal-specific level gives you two
# shades of terminal -- the windows you already had at their old value, new ones at
# the new one -- until every one of them has been restarted. Measured 2026-08-18:
# with generated-glass.conf at 0.94, running kitties still composited at 1.00.
#
# Equal is not a loss. The asymmetry it gives up is that kitty's own opacity fades
# only the background and leaves text fully opaque, where the compositor cannot
# tell glyphs from background and fades both -- so a terminal *can* be glassier
# than the desktop at no cost in legibility. Take that if you want it, and accept
# that it lands one window at a time.
#
# `browser` is where the room to meet is instead: it applies through a stylesheet,
# which Zen reads at startup like kitty reads its opacity, but there is only ever
# one browser window's worth of state to catch up.
#
# Neither can go above `window`: nothing can be more opaque than the compositor
# already makes it.
#
# Set `window` to 1.0 for the app-translucency-only approach (what
# ~/repos/dots does today): nothing fades except surfaces the app itself
# draws translucent, and `terminal` then reaches kitty unmodified.
#
# Keys are "<kind>:<name>" exactly as `noctalia msg color-scheme-get` prints
# them; anything unlisted uses the defaults.

window   = 0.90
terminal = 0.90

# Within a hair of `window`, and the reason is arithmetic rather than taste.
#
# The compositor dims an UNFOCUSED window by 0.06 (write_hypr in bin/noct-glass).
# So any app sitting 0.06 below the window level looks exactly like a window in
# the other focus state -- which is what "zen when active looks like kitty when
# inactive, but not the other way around" is the signature of. Being *the same* as
# a window therefore means being well inside that 0.06, and 0.02 is.
#
# The consequence is worth stating plainly: a browser page cannot be both
# noticeably glassier than a terminal and indistinguishable from one. At 0.83 you
# get the glassy look and the shades read one focus step apart; at 0.88 they read
# as the same material and the transparency mod is only contributing a whisper.
# This is the choice, and it is one number.
#
# What you see can land slightly darker than the number: a page that keeps some
# background of its own stacks its alpha on top of ours. Measured 2026-08-18 on
# reddit, a 0.75 backdrop composited as 0.82.
browser  = 0.88

# --- per-scheme overrides ---------------------------------------------------
#
# Wallpaper-derived palettes are the ones actually designed to sit on an image,
# so they can afford a little more. All three move together, keeping the same
# relationship as the defaults above.
wallpaper:m3-tonal-spot.window   = 0.88
wallpaper:m3-tonal-spot.terminal = 0.88
wallpaper:m3-tonal-spot.browser  = 0.86

# Light schemes need more opacity than dark ones: dark text on a translucent
# light background loses contrast much faster than the reverse.
# builtin:Catppuccin.window = 0.95
# builtin:Catppuccin.terminal = 0.95
