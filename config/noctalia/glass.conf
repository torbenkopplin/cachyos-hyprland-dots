# Frosted glass levels, read by bin/noct-glass.
#
# This is not a Noctalia config file -- Noctalia only auto-loads *.toml from
# this directory, so a .conf here is invisible to it. It lives beside the
# palettes because that is what it is keyed on.
#
# Two knobs. Both are stated as what you SEE, where 1.0 is fully opaque:
#
#   window    every window, applied by the compositor
#             (decoration.active_opacity). This is what frosts GTK and Qt apps,
#             which draw an opaque background and offer no way not to. The cost
#             is that the compositor cannot tell a window's text from its
#             background, so text fades with it.
#
#   terminal  how opaque a terminal ends up. kitty is the one window that can
#             be translucent by itself, and its opacity multiplies with the
#             compositor's -- so noct-glass writes terminal / window into
#             kitty's background_opacity rather than `terminal` itself, and the
#             number you set here is the one you get.
#
# Keeping them equal is the point of stating it this way: a terminal and a
# browser side by side then show exactly as much wallpaper as each other. Give
# `terminal` a lower number if you want the terminal deliberately glassier than
# the rest of the desktop; it cannot go the other way, since nothing can be
# more opaque than the compositor already makes it.
#
# Set `window` to 1.0 for the app-translucency-only approach (what
# ~/repos/dots does today): nothing fades except surfaces the app itself
# draws translucent, and `terminal` then reaches kitty unmodified.
#
# Keys are "<kind>:<name>" exactly as `noctalia msg color-scheme-get` prints
# them; anything unlisted uses the defaults.

window   = 0.90
terminal = 0.90

# --- per-scheme overrides ---------------------------------------------------
#
# Wallpaper-derived palettes are the ones actually designed to sit on an image,
# so they can afford a little more. Both moved together, so the terminal keeps
# matching everything else.
wallpaper:m3-tonal-spot.window   = 0.88
wallpaper:m3-tonal-spot.terminal = 0.88

# Light schemes need more opacity than dark ones: dark text on a translucent
# light background loses contrast much faster than the reverse.
# builtin:Catppuccin.window = 0.95
# builtin:Catppuccin.terminal = 0.95
