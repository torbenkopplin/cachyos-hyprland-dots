# Frosted glass, read by bin/noct-glass.
#
# This is not a Noctalia config file -- Noctalia only auto-loads *.toml from
# this directory, so a .conf here is invisible to it. It lives beside the
# palettes because that is what it is keyed on.
#
# This file is TRACKED, so every level in it applies on every machine that
# pulls. For one machine's own answer, put it in glass.local.conf beside this
# file -- untracked, read after this one, and it wins outright. See
# glass.local.conf.example.
#
# What you actually see
# ---------------------
# A translucent window composites as
#
#   seen = own colour x opacity + backdrop x (1 - opacity)
#
# so the frosted effect is worth exactly
#
#   lift = (backdrop - own colour) x (1 - opacity)
#
# and BOTH halves have to be right. This was got wrong once in each direction:
# an opacity of 0.82 with the blur dimmed to brightness 0.65 measured a lift of
# 3 levels out of 255 -- present in the config, absent on the screen, and the
# windows read as grey squares. `noct-check glass-visible` measures the number
# rather than arguing about it; it wants at least 12.
#
# The levels
# ----------
# Both are stated as what you SEE, where 1.0 is fully opaque:
#
#   window    every window, applied by the compositor
#             (decoration.active_opacity). The compositor cannot tell a
#             window's text from its background, so this fades both.
#
#   terminal  how opaque a terminal ends up. kitty is the one window that can
#             be translucent by itself, and the one that fades its background
#             without fading its text -- so noct-glass writes terminal / window
#             into kitty's background_opacity, and the number you set here is
#             the number you get.
#
# There is no `browser`, and there is not going to be one. A browser is a window
# and gets `window`, like every other app that paints its own background opaque.
#
# Zen is the exception, and it is an exception this file deliberately does not
# describe. The "transparent zen" mod plus the "Zen Internet" extension make it
# draw its own window and page area transparent, and browsers/zen/user.js sets
# the two prefs that allow that -- so Zen IS translucent, at whatever the mod
# paints. What this file used to carry was a third level that TINTED what the mod
# left transparent, to bring a page to the same visible glassiness as a terminal.
# That match was given up on 2026-08-19 and the transparency itself was switched
# back on later the same day: see docs/theming.md. The consequence to know is
# that no number here governs Zen, so it reads as its own material next to
# everything else on screen.
#
# Only the terminal is glass
# --------------------------
# `window` is 1.0. Nothing is faded by the compositor at all, and the only
# translucent surface this file governs is a terminal. That is the whole shape of
# it, and it is a reversal of what the file said earlier on 2026-08-19. (Zen is
# translucent too, from the mod above -- but not from here, and not by any number
# in this file.)
#
# What changed is not a measurement, it is what the measurements were worth.
# Every step of glassiness taken through `window` costs contrast, and every
# step taken through `terminal` costs none: measured with
# `noct-check glass-legible`, a terminal driven from the compositor at 0.60 left
# the ink at 78% of the scheme's foreground and looked washed out at a perfectly
# legal 5.3:1, while the same visible glassiness supplied by kitty left it at
# 90%. At `window = 1.0` it is at 100%.
#
# The old rule was "put `window` as high as the apps that cannot help themselves
# need" -- GTK and Qt draw an opaque background and have no opacity of their
# own, so the compositor is the only thing that can frost them. The trouble is
# that this is the only thing it can do for them: their text goes with it. On a
# machine you actually work on, an editor, a spreadsheet and a chat window whose
# text sits at 85% of its colour over a moving photo is a cost paid all day for
# an effect you stop noticing in a minute.
#
# So the answer is now: those apps do not get glass. They are opaque, on
# purpose, and the terminal -- where it is free -- keeps all of it.
#
# What it costs, stated plainly: "everything matching" is given up. A GTK app is
# opaque and a terminal is at 0.55, and they do not read as the same material,
# because there is no way to make them without fading somebody's text. That
# trade was made deliberately and it is the one thing to reverse if you want the
# old look back -- lower `window` here, or on one machine in glass.local.conf.
#
# Two consequences worth knowing:
#
#   The focus dim goes with it. noct-glass drops an unfocused window 0.06 below
#   `window`, and at 1.0 it does not: dimming the unfocused ones would put back
#   exactly what this setting removes. The focus cue is the border instead -- a
#   gradient on the focused window, a hairline on everything else, which
#   conf/look.lua already draws.
#
#   The blur is still on, and what it is for is a terminal -- plus whatever Zen's
#   mod makes transparent, which gets it for free. Blur is skipped entirely when
#   BOTH levels are opaque, not just `window` -- otherwise a translucent kitty
#   would sit over a sharp, unblurred wallpaper. Note that `terminal = 1.0` would
#   therefore take the blur out from behind Zen as well.
#
# `terminal` cannot go above `window`: nothing can be more opaque than the
# compositor already makes it. Set `terminal = 1.0` for a desktop with no
# translucency anywhere at all.
#
# `terminal` applies live, since 2026-08-19. kitty read background_opacity once
# at startup, so a terminal-specific level used to leave you with two shades of
# terminal until the last old window was closed. `dynamic_background_opacity
# yes` in kitty.conf fixes that, and `noct-check kitty-live` is the test that it
# still does. Without it, none of the above would be available.
#
# Keys are "<kind>:<name>" exactly as `noctalia msg color-scheme-get` prints
# them; anything unlisted uses the defaults.

window   = 1.0
terminal = 0.55

# --- the blur ---------------------------------------------------------------
#
# The other half of the lift -- and with `window` at 1.0, the other half of what
# a terminal is looking through. These reach Hyprland's decoration.blur through
# the same generated file as the levels, so the whole effect is described in one
# place, and it is what sits behind Zen's transparent areas too.
#
#   blur_size, blur_passes   whether the wallpaper arrives as SHAPE or as a flat
#       wash. This is the setting that decides whether a window reads as glass
#       or as paint, and it is not about brightness at all. Around size 32 /
#       passes 4 the blur averages the image away: measured, the backdrop's
#       spatial variation fell to 20 levels, which after a 0.9 opacity reached
#       the eye as 2. At size 8 / passes 2 the photo's structure survives, which
#       is what "I can see a general idea of the wallpaper" means.
#
#       The trade is real and it is the one this setting used to be tuned for:
#       the more shape survives, the more two windows over different parts of
#       the image read as different shades. Flat makes every window identical
#       and makes them all look opaque. There is no value that does both -- and
#       it matters less now that only terminals are translucent.
#
#   blur_brightness   scales the backdrop directly, so it scales the lift
#       directly. At 0.65 this wallpaper (mean luma 99) arrived at 60, which
#       against a window whose own colour is 29 left 30 levels to divide by
#       opacity. At 1.0 it arrives near 95 and there is twice as much to see.
#
#   blur_vibrancy   how much colour survives. 0.05 is greyscale in practice;
#       the wallpaper's colour is most of what tells you there is a photo back
#       there rather than a grey gradient.
#
# Every one of these can be overridden per scheme with the same
# "<kind>:<name>.<key>" prefix as the levels.
blur_size       = 8
blur_passes     = 2
blur_brightness = 1.00
blur_contrast   = 1.0
blur_vibrancy   = 0.15

#   blur_xray   whether a window blurs the WALLPAPER (true) or whatever is
#       actually beneath it (false). Off, so that floating windows stack: a
#       floating terminal over another window samples that window and comes out
#       darker, which is what being in front should look like. Tiled windows are
#       unaffected either way, because columns do not overlap and the thing
#       beneath one of them is the wallpaper regardless.
#
#       This cannot be done per-window: Hyprland accepts `xray` as a window rule
#       and ignores it -- it is a layer rule. See conf/rules.lua.
blur_xray       = false

# --- per-scheme overrides ---------------------------------------------------
#
# Wallpaper-derived palettes are the ones actually designed to sit on an image,
# so they can afford a heavier terminal. Note that it is the TERMINAL that moves
# and not `window`: a per-scheme `window` would hand the compositor back the
# text of every app on the machine, one scheme at a time, which is exactly the
# thing this file just stopped doing.
wallpaper:m3-tonal-spot.terminal = 0.48

# Light schemes need more opacity than dark ones: dark text on a translucent
# light background loses contrast much faster than the reverse -- and they need
# the backdrop dimmed rather than brightened, which is the one case for moving
# blur_brightness per scheme.
# builtin:Catppuccin.terminal         = 0.75
# builtin:Catppuccin.blur_brightness  = 0.75
