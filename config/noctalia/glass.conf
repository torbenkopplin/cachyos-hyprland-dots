# Frosted glass levels, read by bin/noct-glass.
#
# This is not a Noctalia config file -- Noctalia only auto-loads *.toml from
# this directory, so a .conf here is invisible to it. It lives beside the
# palettes because that is what it is keyed on.
#
# One number per scheme: the terminal background opacity, where 1.0 is fully
# opaque and 0.0 is invisible. Everything else is derived from it.
#
# Why the terminal and not the window: making a whole window translucent in
# the compositor fades the *text* too, which is unreadable for work. Real
# frosted glass comes from the app drawing a translucent background and the
# compositor blurring what is behind it. kitty can do that; most GTK/Qt apps
# cannot, which is why "any app possible" is genuinely a short list.
#
# Keys are "<kind>:<name>" exactly as `noctalia msg color-scheme-get` prints
# them. Anything unlisted uses `default`.

default = 0.82

# Your own palettes.
#
# noirblaze is a deliberately flat, near-black scheme (#121212) built around a
# single accent. It was already running at 0.80 in your kitty config, so that
# is kept -- but it is also the scheme most worth setting to 1.0 if you ever
# decide the wallpaper showing through undermines the point of it.
custom:noirblaze = 0.80

# Wallpaper-derived palettes are the ones actually designed to sit on top of an
# image, so they get a little more transparency.
wallpaper:m3-tonal-spot = 0.85
wallpaper:m3-content    = 0.85
wallpaper:m3-monochrome = 0.85

# Light schemes need more opacity than dark ones: dark text on a translucent
# light background loses contrast much faster than the reverse.
# builtin:Catppuccin = 0.90
