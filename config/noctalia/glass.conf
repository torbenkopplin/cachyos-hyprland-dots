# Frosted glass levels, read by bin/noct-glass.
#
# This is not a Noctalia config file -- Noctalia only auto-loads *.toml from
# this directory, so a .conf here is invisible to it. It lives beside the
# palettes because that is what it is keyed on.
#
# Two knobs, both 1.0 = fully opaque:
#
#   window    Hyprland's active_opacity / inactive_opacity. Applies to EVERY
#             window, including GTK and Qt apps that have no transparency
#             support of their own. This is the one that makes the effect
#             universal -- and the one that also fades text, because the
#             compositor cannot tell a window's text from its background.
#
#   terminal  kitty's own background_opacity. kitty draws a translucent
#             background and leaves its glyphs opaque, so this buys
#             transparency without costing legibility. It compounds with
#             `window`: at 0.90 and 0.85 a terminal background ends up around
#             0.77 while its text stays at 0.90.
#
# Set `window` to 1.0 for the app-translucency-only approach (what
# ~/repos/dots does today): nothing fades except surfaces the app itself
# draws translucent.
#
# Keys are "<kind>:<name>" exactly as `noctalia msg color-scheme-get` prints
# them; anything unlisted uses the defaults.

window   = 0.90
terminal = 0.85

# --- per-scheme overrides ---------------------------------------------------
#
# noirblaze is a deliberately flat near-black scheme built around one accent.
# Its terminal was already at 0.80 in your kitty config, so that is kept.
custom:noirblaze.terminal = 0.80

# Wallpaper-derived palettes are the ones actually designed to sit on an
# image, so they can afford a little more.
wallpaper:m3-tonal-spot.window   = 0.88
wallpaper:m3-tonal-spot.terminal = 0.82

# Light schemes need more opacity than dark ones: dark text on a translucent
# light background loses contrast much faster than the reverse.
# builtin:Catppuccin.window = 0.95
