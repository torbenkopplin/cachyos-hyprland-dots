## Noctalia -- the bar.
##
## Design: there is no bar while you work. It appears for three reasons:
##
##   1. a Noctalia panel opened (launcher, control centre, clipboard, session,
##      window switcher);
##   2. you pressed SUPER+B to pin it;
##   3. you pushed the pointer at the top edge.
##
## All three are driven from the compositor by config/hypr/lib/bar.lua, which
## watches layer.opened / layer.closed for the panels and polls the cursor for the
## edge. The pointer reveal was added 2026-08-19 as the mouse backup to a
## keyboard-first setup.
##
## auto_hide is OFF, and not for the reason it used to be. The old note here said
## Noctalia's auto-hide is pointer-proximity based and would fight a
## keyboard-opened bar. The first half is not true: measured on 5.0.0-beta.8 with
## auto_hide confirmed true by `config export merged`, the bar collapses to a strip
## at the screen edge and stays collapsed with the pointer parked inside it -- on
## `top` and on `overlay`, with and without reserved space. Whatever it gates, it
## is not proximity, so it buys nothing here and lib/bar.lua does the edge itself.
##
## The second half still stands as a rule, though: only ONE thing may have an
## opinion about this surface. With auto_hide off, bar-show / bar-hide are absolute
## and the state is exactly what lib/bar.lua last asked for.
##
## reserve_space is off too, so the bar never claims an exclusive zone:
## windows keep the full height of the display and nothing reflows when it
## appears or disappears.
##
## Because it is summoned rather than lived with, it is worth putting real
## information on it -- this is a HUD, not decoration.
##
## Form: three separate capsules, pushed apart
## -------------------------------------------
## Navigation at the start, the clock in the centre, status at the end, each in
## its own capsule with nothing drawn between them. The bar surface itself is
## invisible -- `background_opacity = 0.0` -- so what you see is three islands
## over the wallpaper, not a strip with content on it.
##
## This is the third form in a day and the reasoning is worth keeping, because
## every alternative is ruled out by something measured rather than by taste.
##
##   Three opaque capsules, adjacent, centred. The original. Read as one clump
##   with seams, and the media capsule restated the window title verbatim.
##
##   One full-width glass shape. Tried, and it is the only way to get the panels'
##   material: `[shell.panel] transparency_mode = "glass"` made the panels
##   translucent, and the bar surface is the only thing here that takes an
##   opacity. It looked right and it is not what was wanted -- a continuous strip
##   spanning 3440px, with the content either huddled in the middle or stretched
##   to the corners.
##
##   One glass shape, but SMALLER. This is the one that cannot be built. There is
##   no width key on a bar; `margin_ends` is the only lever, it is absolute pixels,
##   and it is shared by every monitor. At 1200 the 3440px bar becomes a pleasant
##   1064px island and the 1080px portrait bar collapses to w = 0. "25%" is not a
##   percentage -- it rendered as a flat 88px on both. `monitor = "DP-3"` passes
##   validation and is then ignored: the bar drew on both screens anyway. A second
##   `[bar.<name>]` block DOES work and can carry its own margin_ends, but it
##   inherits nothing -- around twenty styling keys and the whole lane list would
##   have to be duplicated and kept in sync -- and it would hard-code a pixel width
##   to one particular screen, which is exactly the trap `WSBANDS` already is for a
##   machine that gets plugged into unfamiliar monitors.
##
## So: separate shapes, which means capsules, which means opaque. A capsule cannot
## be glass (see below), and that is the price. What it buys is a form with no
## resolution baked into it at all -- capsules size to their content and the lanes
## place them by proportion, so this looks the same on an ultrawide, on the
## portrait panel, and on a laptop that has never been seen before.
##
## The blur comes from the layer rule in conf/hypr/conf/rules.lua, whose
## ignore_alpha = 0.5 is what keeps the *transparent* part of the bar from being
## blurred along with the capsules.

[bar.default]
position = "top"

auto_hide                = false   # see above -- lib/bar.lua owns visibility
smart_auto_hide          = false   # ditto; not a proximity reveal either
show_on_workspace_switch = false   # workspace changes must not flash the bar
reserve_space            = false   # no exclusive zone: full-height windows
layer                    = "overlay"  # visible even over a fullscreen window

## 30 rather than 34: the bar is summoned, not lived with, so it should read
## as an overlay rather than as a piece of furniture. At this height the clock
## and the widget glyphs are still full size -- the padding around them is what
## went.
thickness          = 30

## Inset like a window, on all three sides. margin_ends is the distance from the
## left and right screen edges, margin_edge the distance from the top one.
margin_edge  = 10
margin_ends  = 10

## The bar surface IS the shape, as of 2026-08-19, and it is the same material as
## the panels this shell opens -- which is the whole point of the change.
##
## 0.76 is measured, not chosen. With `[shell.panel] transparency_mode = "glass"`
## the launcher's body rendered at grey 41 over a backdrop measuring 115, and the
## palette's `surface` is #121212 = 18, so
##
##   alpha = (41 - 115) / (18 - 115) = 0.76
##
## Re-measure it if you change transparency_mode: open the launcher, sample its
## body and the same patch with it closed, and solve that again.
background_opacity   = 0.0
border_width         = 0
concave_edge_corners = false
radius_top_left      = 12
radius_top_right     = 12
radius_bottom_left   = 12
radius_bottom_right  = 12

## Capsules are the visible surfaces, and they are opaque whether you like it or
## not. A GROUP capsule is drawn as `surface_variant` no matter what is asked for:
## `capsule_fill` and `capsule_opacity` are read, reported by
## `config export merged`, and then ignored -- set to #ff0000 at 0.30, reloaded,
## and the capsule came out pixel-identical at 53,53,55. `shadow` and
## `contact_shadow` go the same way.
##
## That is the whole reason this bar does not match the panels' glass. It is not an
## oversight and it is not tuneable from here; it would need Noctalia to honour the
## keys it already accepts, or a theme-level surface alpha.
##
## That is not a compromise, as it happens. #323232 opaque is exactly what a
## Noctalia popup's cards are made of -- sampled off the running control centre,
## whose body is #101010 with #323232 cards at a corner radius of 12 -- so the
## bar's capsules and the panels it opens are the same material by construction.
## A popup reads solid rather than glassy: the frosted glass belongs to the
## windows behind, not to the shell's own furniture.
##
## What does apply to a group capsule is the geometry: radius, padding, and
## thickness as a fraction of the bar's own height, so the capsule sits inside it
## with air around rather than filling it edge to edge.
## `shadow` and `contact_shadow` join capsule_fill on the list of keys that are
## read and then ignored for a group capsule: set true, reloaded, and the capsules
## came out pixel-identical over a dark window. Left false rather than left in
## looking like they do something.
capsule              = true
capsule_padding      = 10
capsule_radius       = 12
capsule_thickness    = 0.8

## padding is the bar's inner inset and, with no capsules, the only thing keeping
## the widgets off the glass edge. Set to the corner radius on purpose: at 12 the
## end-most icon clears the corner's arc, at 8 it grazes it, at 0 it touches. It
## insets horizontally without shrinking the glyphs -- checked at 8 and 14.
padding        = 0
widget_spacing = 10

shadow          = false
hover_highlight = true
font_weight     = 500

## Lanes hold "group:<id>", and a group is a CONTAINER -- that is what draws each
## capsule. Lanes also accept bare widget ids, and that is worth knowing because it
## is the difference between the two forms: with groups the bar reads 49-60 grey
## where they are and the backdrop in between (three shapes), with bare widget ids
## it draws no containers at all (one shape, or none). Groups here, deliberately.
##
## A "group:<id>" naming no capsule_group below is dropped with a warning at load.
## An unreferenced capsule_group is fine and validate passes -- which is why
## `media` can keep its group without appearing anywhere.
##
## `media` is deliberately in no lane, and that is rule 3 below applied to the bar
## itself -- nothing may state what something else already states. A browser tab is
## both the focused window and the media source, so the media widget spent its
## width restating `active_window` verbatim: measured on the portrait bar, "Reddit
## - The heart of the internet" appeared twice, filling most of 1060px to say one
## thing.
##
## There is no way to configure that away. `max_length` will not go below 40
## (validate: "below minimum 40"), so it cannot be shortened to a stub, and the
## widget has no art-only mode -- at 0 it renders the album art plus a literal
## ellipsis. So it comes out of the lanes instead. Now-playing lives in the control
## centre, SUPER+A; add "media" to a lane to bring it back.
##
## Widget ids are arbitrary -- `type` is what names the widget -- which is how
## `date` below can be a second clock. Upstream's own type spelling is
## inconsistent on purpose: most are snake_case, "control-center" is not.
start  = ["group:navigation"]
center = ["group:time"]
end    = ["group:status"]

## Where you are, and what you are looking at -- in that order of importance,
## which the colours below reinforce.
[[bar.default.capsule_group]]
id      = "navigation"
members = ["workspaces", "gap", "active_window"]

## Time, then date at half the emphasis.
[[bar.default.capsule_group]]
id      = "time"
members = ["clock", "date"]

[[bar.default.capsule_group]]
id      = "media"
members = ["media"]

## System state and the one button. The tray leads because its width is the only
## thing here that changes; the fixed icons stay anchored to the screen edge.
[[bar.default.capsule_group]]
id      = "status"
members = ["tray", "network", "bluetooth", "volume", "battery", "notifications", "control-center"]

## ---------------------------------------------------------------------------
## Widgets
##
## Three rules hold the styling together:
##
##   1. ONE accent. `primary` marks the workspace you are on and the button that
##      opens the control centre -- nothing else, apart from a battery warning,
##      which is a state and not decoration. A bar that colours every widget by
##      category has no way left to say "here".
##   2. Two text levels. `on_surface` for what you read (the clock, the
##      workspace you are on), `on_surface_variant` for what you glance at (the
##      window title, the date, the track). Weight follows: 600 for the clock,
##      the bar default of 500 for everything else.
##   3. Nothing states in words what its icon already says. The network widget
##      was printing `enp4s0` and the battery a percentage for a mouse; both are
##      icons now, with the detail in the tooltip and the panel behind them.
## ---------------------------------------------------------------------------

## Numbers rather than dots: the bar is summoned rather than watched, so when it
## does appear "which workspace is this" should be readable rather than inferred.
## The active pill is more than twice as long as the others, which is what makes
## the row read as a position on a strip instead of a set of buttons.
[widget.workspaces]
style                     = "regular"
label_source              = "id"
show_labels               = true
labels_only_when_occupied = false
active_pill_size          = 2.4
inactive_pill_size        = 1.0
pill_scale                = 0.9
focused_color             = "primary"
occupied_color            = "on_surface_variant"
empty_color               = "outline"

[widget.gap]
type   = "spacer"
length = 12

## The bar is hidden while you work, so when it does appear the window title is
## useful context rather than permanent noise -- give it room, but keep it a
## shade quieter than the workspace it belongs to.
## text_only, not icon_and_text: the widget draws a window glyph before the title
## either way -- that one is not optional -- so asking for the app icon as well
## gets you two icons for one window. The title is the context; the glyph in front
## of it is enough of a marker.
## min_length = max_length is what keeps the cluster still. Centred content grows
## in both directions, so a variable-width title would slide the clock and the
## status icons sideways every time you changed window. A fixed box does not.
[widget.active_window]
display      = "text_only"
## The capsule hugs the title now. This used to be min_length = max_length = 260,
## a fixed box so a centred cluster would not slide sideways as you changed
## windows -- but the capsules sit in start/centre/end lanes since 2026-08-20, so
## the clock and the status icons are anchored and cannot move. All that grows is
## this capsule's right edge, which is where a title belongs anyway. max_length
## still truncates so one long title cannot push into the clock.
min_length   = 0
max_length   = 260
title_scroll = "on_hover"
color        = "on_surface_variant"

## The clock is the one thing on this bar you look at deliberately, so it is the
## only text carrying weight.
[widget.clock]
format      = "{:%H:%M}"
font_weight = 600
color       = "on_surface"

## A second clock, as the date: same capsule, half the emphasis. A date is
## something you check, not something you read.
[widget.date]
type        = "clock"
format      = "{:%a %d %b}"
font_weight = 400
color       = "on_surface_variant"

## Title only, capped. The artist doubles the width for something the sound has
## already told you.
[widget.media]
hide_when_no_media = true
hide_artist        = true
art_size           = 18
max_length         = 260
title_scroll       = "on_hover"
color              = "on_surface_variant"

## Third-party icons, so the one thing worth enforcing is that they sit on the
## same rhythm as everything else rather than jammed together.
[widget.tray]
match_adjacent_spacing = true

## `enp4s0` on a bar is a debug print, not information: the interface, the
## address and the speed are all in the panel this opens.
[widget.network]
show_label = false

## Hidden when nothing is connected, rather than a permanently dead glyph.
## SUPER+CTRL+B reaches the devices either way.
[widget.bluetooth]
show_label                    = false
hide_when_no_connected_device = true

[widget.volume]
show_label = false
mute_color = "outline"

## Kept for the machines that have one: with no battery at all the widget draws
## nothing, so it costs this desktop a line of config and no pixels. A glyph
## rather than a percentage, and `error` for the warning -- the one other colour
## allowed here, because a flat battery is a state you need told rather than a
## category being decorated.
[widget.battery]
display_mode  = "glyph"
show_label    = false
label_content = "percent"
warning_color = "error"

## Silent unless there is something to say.
[widget.notifications]
hide_when_no_unread = true

## The one button, and the only other thing allowed to use the accent.
[widget.control-center]
color = "primary"
