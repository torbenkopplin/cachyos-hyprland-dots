## Noctalia -- the bar.
##
## Design: there is no bar while you work. It appears for three reasons:
##
##   1. a Noctalia panel opened (launcher, control centre, clipboard, session,
##      window switcher);
##   2. you pressed SUPER+B to pin it;
##   3. you pushed the pointer at the top edge.
##
## All three are driven from the compositor by config/hypr/lib/bar.lua, which
## watches layer.opened / layer.closed for the panels and polls the cursor for the
## edge. The pointer reveal was added 2026-08-19 as the mouse backup to a
## keyboard-first setup.
##
## auto_hide is OFF, and not for the reason it used to be. The old note here said
## Noctalia's auto-hide is pointer-proximity based and would fight a
## keyboard-opened bar. The first half is not true: measured on 5.0.0-beta.8 with
## auto_hide confirmed true by `config export merged`, the bar collapses to a strip
## at the screen edge and stays collapsed with the pointer parked inside it -- on
## `top` and on `overlay`, with and without reserved space. Whatever it gates, it
## is not proximity, so it buys nothing here and lib/bar.lua does the edge itself.
##
## The second half still stands as a rule, though: only ONE thing may have an
## opinion about this surface. With auto_hide off, bar-show / bar-hide are absolute
## and the state is exactly what lib/bar.lua last asked for.
##
## reserve_space is off too, so the bar never claims an exclusive zone:
## windows keep the full height of the display and nothing reflows when it
## appears or disappears.
##
## Because it is summoned rather than lived with, it is worth putting real
## information on it -- this is a HUD, not decoration.
##
## Form: one glass pill that is exactly as wide as what is in it
## --------------------------------------------------------------
## Decision 028. The bar SURFACE spans the monitor and draws nothing at all; the
## one thing you see is a single capsule group in the centre lane, made of the
## same glass as the panels it opens. A capsule sizes itself to its content, so
## the pill grows when a workspace opens and shrinks when it closes, on every
## monitor, at every scale -- there is no width anywhere in this file.
##
## That is the whole trick, and it took Noctalia 5.5 to make it possible: on
## 5.0.0-beta.8 a group capsule drew opaque `surface_variant` whatever fill or
## opacity it was given (decision 009). On 5.5 both are honoured -- measured
## 2026-11-15 with a red fill: (255,0,0) at 1.0, (183,4,8) at 0.7.
##
## Two other ways of getting a pill were built and are NOT how this works:
##
##   `margin_ends` as a percentage. Works on 5.5 (per end: "40%" is a 384px
##   bar on a 1920px screen), but a percentage follows the SCREEN, not the
##   content -- 688px of mostly empty glass on a 3440 ultrawide, 216px that
##   cannot hold the widgets on a 1080 portrait panel.
##
##   `margin_ends` in pixels, worked out per monitor by the compositor and
##   written to a generated file. It does follow any monitor, but it is a fixed
##   box, and the workspace row is dynamic (decision 017): too many workspaces
##   overflow it, too few leave glass at both ends. Recomputing it on every
##   change is not an option either -- every config reload tears the bar down
##   and builds it again (Noctalia's log: "creating #0 ... on eDP-1").

[bar.default]
position = "top"

auto_hide                = false   # see above -- lib/bar.lua owns visibility
smart_auto_hide          = false   # ditto; not a proximity reveal either
show_on_workspace_switch = false   # workspace changes must not flash the bar
reserve_space            = false   # no exclusive zone: full-height windows
layer                    = "overlay"  # visible even over a fullscreen window

## The surface: full width, and invisible. margin_ends = 0 is deliberate -- the
## surface is the box the pill is centred in and is clipped to, so a narrower
## surface would just be a second place to run out of room.
##
## Nothing outside the pill is drawn, blurred or darkened: with the pill shown,
## the strip either side of it was pixel-identical to the screen with the bar
## hidden (2026-11-15). The blur is the layer rule in conf/rules.lua, and its
## ignore_alpha = 0.5 is what confines it to the pill -- see the opacity below.
background_opacity   = 0.0
border_width         = 0          # it would outline the invisible surface: a full-width line
margin_ends          = 0
concave_edge_corners = false

## 6px off the top edge, so the pill floats rather than hangs. lib/bar.lua's
## HOT_EDGE_KEEP_PX has to clear margin_edge + thickness (40) -- raise it if
## either of these grows.
margin_edge = 6

## The pill IS the bar's height: capsule_thickness 1.0 on a 34px bar. Taller than
## the 24px capsules the three-capsule bar had, because a lone pill needs some
## glass above and below its content to read as an object rather than as a
## highlight behind a row of text. The glyphs are the same size as before.
thickness         = 34
capsule_thickness = 1.0

capsule         = true
capsule_padding = 10
capsule_radius  = 12    # the workspace pills inside take this; fully round at their size
padding         = 0
widget_spacing  = 10

## `shadow` draws nothing for this bar: set true, the strip outside the pill came
## out pixel-identical. Left false rather than left looking like it does something.
shadow          = false
compositor_blur = true    # the pill's frost; the Flat design turns it off
hover_highlight = true
font_weight     = 500

start  = []
center = ["group:pill"]
end    = []

## The rest of the surface is not a dead strip across the top of every window.
## Measured: it renders nothing; this makes it take nothing either, so a click
## beside the pill reaches the tab bar or title underneath.
[bar.default.dead_zone]
click_through = true

## Where you are, what time it is, and the state of the machine, in that order.
## The `gap` spacers do the separating; dividers were tried (a `text` widget
## holding a dot) and only added width -- the sections already look different.
##
## The material is the panels' material, by measurement rather than by eye: with
## `[shell.panel] transparency_mode = "glass"` the launcher's body rendered at
## grey 41 over a backdrop measuring 115, and the palette's `surface` is
## #121212 = 18, so
##
##   alpha = (41 - 115) / (18 - 115) = 0.76
##
## Re-measure it if you change transparency_mode: open the launcher, sample its
## body and the same patch with it closed, and solve that again. Keep it above
## conf/rules.lua's ignore_alpha (0.5) -- below that Hyprland stops blurring the
## pill and it turns into tinted clear glass. `noct-check bar-pill-config` holds
## that line, and `noct-check bar-pill` measures the blur on screen.
##
## The hairline border is what keeps a dark pill visible over a dark wallpaper;
## without it the shape all but disappears and only the glyphs are left. It is
## the same outline the control centre draws around itself, so the pill and the
## panel that opens under it read as one family.
##
## radius = 17 is half the height: a true pill, not a rounded rectangle.
##
## `media` and `active_window` are in no lane. Media restated the window title
## verbatim; the window title would make the pill change width on every focus
## change. Add either to `members` to bring it back.
[[bar.default.capsule_group]]
id           = "pill"
members      = ["workspaces", "gap", "clock", "date", "gap",
                "tray", "network", "bluetooth", "volume", "brightness",
                "battery", "notifications", "control-center"]
fill         = "surface"
opacity      = 0.76
radius       = 17
padding      = 14
border       = "outline_variant"
border_width = 1

## ---------------------------------------------------------------------------
## Widgets
##
## Three rules hold the styling together:
##
##   1. ONE accent. `primary` marks the workspace you are on and the button that
##      opens the control centre -- nothing else, apart from a battery warning,
##      which is a state and not decoration. A bar that colours every widget by
##      category has no way left to say "here".
##   2. Two text levels. `on_surface` for what you read (the clock, the
##      workspace you are on), `on_surface_variant` for what you glance at (the
##      date, the status icons). Weight follows: 600 for the clock, the bar
##      default of 500 for everything else.
##   3. Nothing states in words what its icon already says. The network widget
##      was printing `enp4s0` and the battery a percentage for a mouse; both are
##      icons now, with the detail in the tooltip and the panel behind them.
##
## The status icons are quieted one widget at a time, not with the group's
## `foreground` key: that overrides every member's own colour, and took the
## accent off the control-centre button with it.
## ---------------------------------------------------------------------------

## Numbers rather than dots: the bar is summoned rather than watched, so when it
## does appear "which workspace is this" should be readable rather than inferred.
## The active pill is more than twice as long as the others, which is what makes
## the row read as a position on a strip instead of a set of buttons.
[widget.workspaces]
style                     = "regular"
label_source              = "id"
show_labels               = true
labels_only_when_occupied = false
active_pill_size          = 2.4
inactive_pill_size        = 1.0
pill_scale                = 0.9
focused_color             = "primary"
occupied_color            = "on_surface_variant"
empty_color               = "outline_variant"

## The space between sections of the pill.
[widget.gap]
type   = "spacer"
length = 16

## Not in the pill (see the capsule group). If it goes back in, give it a fixed
## box -- min_length = max_length -- or the pill changes width with every window
## you focus and the clock slides with it.
[widget.active_window]
display      = "text_only"
min_length   = 260
max_length   = 260
title_scroll = "on_hover"
color        = "on_surface_variant"

## The clock is the one thing on this bar you look at deliberately, so it is the
## only text carrying weight.
[widget.clock]
format      = "{:%H:%M}"
font_weight = 600
color       = "on_surface"

## A second clock, as the date: half the emphasis. A date is something you
## check, not something you read.
[widget.date]
type        = "clock"
format      = "{:%a %d %b}"
font_weight = 400
color       = "on_surface_variant"

## Not in the pill (see the capsule group). Title only, capped.
[widget.media]
hide_when_no_media = true
hide_artist        = true
art_size           = 18
max_length         = 260
title_scroll       = "on_hover"
color              = "on_surface_variant"

## Third-party icons, so the one thing worth enforcing is that they sit on the
## same rhythm as everything else rather than jammed together.
[widget.tray]
match_adjacent_spacing = true

## `enp4s0` on a bar is a debug print, not information: the interface, the
## address and the speed are all in the panel this opens.
[widget.network]
show_label = false
color      = "on_surface_variant"

## Hidden when nothing is connected, rather than a permanently dead glyph.
## SUPER+CTRL+B reaches the devices either way.
[widget.bluetooth]
show_label                    = false
hide_when_no_connected_device = true
color                         = "on_surface_variant"

[widget.volume]
show_label = false
color      = "on_surface_variant"
mute_color = "outline_variant"

## Next to volume because it is the same kind of thing: a level, shown as an
## icon, with no number on the bar (rule 3). External monitors are reached over
## DDC/CI, see 15-brightness.toml.
[widget.brightness]
show_label = false
color      = "on_surface_variant"

## Kept for the machines that have one: with no battery at all the widget draws
## nothing, so it costs a desktop a line of config and no pixels. A glyph
## rather than a percentage, and `error` for the warning -- the one other colour
## allowed here, because a flat battery is a state you need told rather than a
## category being decorated.
[widget.battery]
display_mode  = "glyph"
show_label    = false
label_content = "percent"
color         = "on_surface_variant"
warning_color = "error"

## Silent unless there is something to say. The unread dot is its own state
## colour; the bell itself is quiet like the rest.
[widget.notifications]
hide_when_no_unread = true
color               = "on_surface_variant"

## The one button, and the only other thing allowed to use the accent.
[widget.control-center]
color = "primary"
