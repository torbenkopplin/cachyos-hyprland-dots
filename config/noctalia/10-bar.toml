## Noctalia -- the bar.
##
## Design: there is no bar while you work. It appears for two reasons only:
##
##   1. a Noctalia panel opened (launcher, control centre, clipboard, session,
##      window switcher);
##   2. you pressed SUPER+B to pin it.
##
## Both are driven from the compositor by config/hypr/lib/bar.lua, which
## watches layer.opened / layer.closed and issues bar-show / bar-hide.
##
## auto_hide is OFF on purpose. Noctalia's own auto-hide is pointer-proximity
## based, and it would retract the bar again the moment we revealed it for a
## keyboard-opened launcher. With auto_hide off, bar-hide/bar-show are absolute
## and the state is exactly what lib/bar.lua last asked for.
##
## reserve_space is off too, so the bar never claims an exclusive zone:
## windows keep the full height of the display and nothing reflows when it
## appears or disappears.
##
## Because it is summoned rather than lived with, it is worth putting real
## information on it -- this is a HUD, not decoration.
##
## Form: three floating islands
## ---------------------------
## The desktop is a set of separate translucent surfaces, each inset from the
## screen edge by GAPS_OUT and framed by a hairline. A full-width slab welded to
## the top edge with concave corners was the one thing on screen built to a
## different rule -- so the bar is now made of the same parts as everything else:
##
##   * the bar surface itself is invisible (background_opacity = 0, no border);
##   * its widgets live in three capsules -- navigation, time, status -- which
##     are the surfaces you actually see;
##   * those capsules are inset 10px like a window (GAPS_OUT), carry the same
##     radius as a window (ROUNDING = 2, near-square) and the same opacity as
##     the frosted-glass level.
##
## The blur comes from the layer rule in conf/hypr/conf/rules.lua, whose
## ignore_alpha = 0.5 is what keeps the *transparent* part of the bar from being
## blurred along with the capsules.

[bar.default]
position = "top"

auto_hide                = false   # see above -- lib/bar.lua owns visibility
smart_auto_hide          = false
show_on_workspace_switch = false   # workspace changes must not flash the bar
reserve_space            = false   # no exclusive zone: full-height windows
layer                    = "overlay"  # visible even over a fullscreen window

## 30 rather than 34: the bar is summoned, not lived with, so it should read
## as an overlay rather than as a piece of furniture. At this height the clock
## and the widget glyphs are still full size -- the padding around them is what
## went.
thickness          = 30

## Inset like a window, on all three sides. margin_ends is the distance from the
## left and right screen edges, margin_edge the distance from the top one.
margin_edge  = 10
margin_ends  = 10

## The bar surface itself is not drawn: no fill, no border, no corners to speak
## of. Everything visible is a capsule. (Setting a radius here would only round
## something you cannot see -- it stays at the window radius so that turning the
## fill back on gives you a sane single island rather than a slab.)
background_opacity   = 0.0
border_width         = 0
concave_edge_corners = false
radius_top_left      = 2
radius_top_right     = 2
radius_bottom_left   = 2
radius_bottom_right  = 2

## Capsules are the visible surfaces. 0.90 is the default `window` level in
## glass.conf -- what `noct-glass show` reports -- so a capsule and a window show
## the same amount of wallpaper through them; radius 2 matches ROUNDING in
## conf/options.lua. This is the one number that does not follow glass.conf on
## its own: noct-glass deliberately writes no Noctalia config (that hook fires on
## config-driven palette changes, so generating a .toml from it risks a reload
## loop), so a per-scheme override there means editing this by hand.
##
## capsule_thickness is a fraction of `thickness`, so the capsule sits inside the
## bar's height with a little air around it rather than filling it edge to edge.
capsule              = true
capsule_fill         = "surface_variant"
capsule_opacity      = 0.90
capsule_padding      = 8
capsule_radius       = 2
capsule_thickness    = 0.8

## padding is the bar's own inner inset, which the capsules would otherwise sit
## inside twice over. Spacing between the three islands is widget_spacing.
padding        = 0
widget_spacing = 10

shadow          = false
hover_highlight = true
font_weight     = 500

## Lanes name capsule groups rather than widgets; a "group:<id>" entry with no
## matching capsule_group below is dropped with a warning at load.
##
## Widget ids are upstream's own spelling, which is inconsistent on purpose:
## most are snake_case, "control-center" is not.
start  = ["group:navigation"]
center = ["group:time"]
end    = ["group:status"]

## Where you are, and what you are looking at.
[[bar.default.capsule_group]]
id      = "navigation"
members = ["workspaces", "gap", "active_window"]

[[bar.default.capsule_group]]
id      = "time"
members = ["clock"]

## Everything that is a state rather than a place.
[[bar.default.capsule_group]]
id      = "status"
members = ["media", "tray", "notifications", "network", "bluetooth", "volume", "battery", "control-center"]

[widget.gap]
type   = "spacer"
length = 16

[widget.clock]
format = "{:%H:%M  ·  %a %d %b}"

[widget.media]
hide_when_no_media = true
title_scroll       = "on_hover"

## The bar is hidden while you work, so when it does appear the window title is
## useful context rather than permanent noise -- give it room.
[widget.active_window]
max_length   = 420
title_scroll = "on_hover"
