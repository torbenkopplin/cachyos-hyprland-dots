## Noctalia -- app theming templates.
##
## Whenever the palette changes, Noctalia re-renders every enabled template and
## writes the result into the target app's config. That is the whole mechanism:
## one palette, many rendered config files.
##
## Built-ins cover apps Noctalia knows about. The three user templates below
## fill the gaps that matter for this setup -- Hyprland's window borders,
## kitty's colours, and repainting terminals that are *already open*.
##
## To see every id available on your machine:  noctalia theme --list-templates
## To re-render without changing the theme:    noctalia msg templates-apply

[theme.templates]
enable_builtin_templates = true

## gtk3/gtk4  -> GTK app colours
## qt         -> qt5ct/qt6ct palettes; needs QT_QPA_PLATFORMTHEME=qt6ct,
##               which conf/env.lua sets
## kcolorscheme -> kdeglobals, for the KDE apps CachyOS ships (dolphin, ark)
## btop       -> btop's theme
##
## Every id here writes to a path this repo does NOT track, which is the rule
## that keeps built-ins safe to enable: install.sh deploys by symlink, so a
## built-in whose output path happens to be a tracked file edits the checkout
## itself. `kitty` is exactly that case and is handled as a user template below.
## Check where an id writes before adding it. `starship` and the community
## `yazi` template are the ones to look at twice, since this repo tracks
## starship.toml and yazi.toml.
builtin_ids = ["gtk3", "gtk4", "qt", "kcolorscheme", "btop"]

## ---------------------------------------------------------------------------
## Hyprland window borders
##
## Noctalia v5 does ship a built-in `hyprland` id, but it emits hyprland.conf
## syntax and this config is Lua, so it is no use here. The borders come from a
## user template instead: it renders a small Lua file that hyprland.lua dofiles
## last, then reloads the compositor.
## ---------------------------------------------------------------------------

[theme.templates.user.hyprland]
input_path  = "$XDG_CONFIG_HOME/noctalia/templates/hyprland-colors.lua"
output_path = "$XDG_CONFIG_HOME/hypr/generated/colors.lua"
post_hook   = "hyprctl reload"

## ---------------------------------------------------------------------------
## kitty colours (new windows)
##
## Replaces the built-in `kitty` id, which rewrites kitty.conf itself to point
## at a file of its own choosing -- and kitty.conf is tracked and symlinked, so
## that dirties the repo on every palette change. Rendering to a fixed path we
## chose instead means kitty.conf can include it once and never be touched
## again. See the header of templates/kitty-colors.conf.
##
## No post_hook: kitty only reads its config at startup, and repainting the
## windows already open is what the terminal_live template below is for.
## ---------------------------------------------------------------------------

[theme.templates.user.kitty]
input_path  = "$XDG_CONFIG_HOME/noctalia/templates/kitty-colors.conf"
output_path = "$XDG_CONFIG_HOME/kitty/generated-colors.conf"

## ---------------------------------------------------------------------------
## Live terminal repaint
##
## The kitty template above only affects terminals started after the change.
## This one pushes OSC colour sequences into every pty you already have open,
## so running shells, vim and btop all change colour immediately -- and it
## works for any terminal emulator, not just kitty.
##
## Drop this entry if you would rather terminals only change on restart, or if
## the momentary repaint of a full-screen TUI bothers you.
## ---------------------------------------------------------------------------

## Note the two different expansions. Noctalia resolves $XDG_CACHE_HOME in
## output_path per the XDG spec (falling back to ~/.cache when the variable is
## unset). post_hook is handed to a shell instead, which would expand an unset
## $XDG_CACHE_HOME to nothing -- hence the explicit :- default there.
[theme.templates.user.terminal_live]
input_path  = "$XDG_CONFIG_HOME/noctalia/templates/terminal-colors.sh"
output_path = "$XDG_CACHE_HOME/noctalia/terminal-colors.sh"
post_hook   = "bash \"${XDG_CACHE_HOME:-$HOME/.cache}/noctalia/terminal-colors.sh\""
