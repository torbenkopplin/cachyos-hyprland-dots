# Wallpaper sets, read by bin/noct-wallfetch.
#
# Not a Noctalia config file -- Noctalia only auto-loads *.toml from this
# directory, so this is invisible to it. It sits here because the directories
# it fills are the ones 60-wallpaper.toml points each monitor at.
#
#   <name>  <subdir>  <count>  <wallhaven /api/v1/search params>
#
# Params are passed through verbatim, so anything the Wallhaven API accepts
# works: https://wallhaven.cc/help/api
#
#   categories=010   general/anime/people as three bits -- 010 is anime only
#   purity=100       SFW only (110 adds sketchy, and needs an API key)
#   ratios=21x9      21x9, 32x9, 16x9, 9x16 ... comma-separated
#   atleast=WxH      minimum resolution
#   sorting=favorites   best-of rather than newest
#
# A note on what is actually out there, measured rather than assumed:
#
#   dragonball, 16x9, >=2560x1440   353 results
#   dragonball, any ratio           1225 results
#   dragonball, 9x16 (portrait)     42 results
#   dragonball, 21x9 or 32x9        *4 results*
#
# Four. Ultrawide Dragon Ball essentially does not exist. So the ultrawide
# monitor gets those four plus a wider net -- big 16:9 Dragon Ball art that
# survives a centre crop, and a general anime-ultrawide pool to keep rotation
# from repeating. See README for the reasoning.

# --- ultrawide (21:9 / 32:9) ------------------------------------------------

# The entire supply of true ultrawide Dragon Ball.
db-ultrawide   ultrawide   10   q=dragonball&ratios=21x9,32x9&categories=010&purity=100&sorting=favorites

# Dragon Ball big enough that Noctalia's `crop` fill mode can take an ultrawide
# slice without visible softness. Composition still gets cropped top and bottom;
# this is the compromise the supply forces.
db-wide-crop   ultrawide   20   q=dragonball&atleast=3440x1440&categories=010&purity=100&sorting=favorites

# Native ultrawide anime, so rotation on the wide screen has somewhere to go.
anime-ultrawide ultrawide  20   ratios=21x9,32x9&atleast=3440x1440&categories=010&purity=100&sorting=favorites

# --- standard (16:9 / 16:10) ------------------------------------------------

db-standard    standard    40   q=dragonball&ratios=16x9&atleast=2560x1440&categories=010&purity=100&sorting=favorites

# --- portrait (9:16) --------------------------------------------------------

db-portrait    portrait    20   q=dragonball&ratios=9x16&categories=010&purity=100&sorting=favorites
anime-portrait portrait    20   ratios=9x16&atleast=1440x2560&categories=010&purity=100&sorting=favorites
