# TEMPLATE -- rendered by Noctalia into ~/.config/kitty/generated-colors.conf
# whenever the palette changes. Do not edit the rendered copy; edit this one.
#
# Why this is a user template and not the built-in `kitty` id
# -----------------------------------------------------------
# The built-in template does not just write a colour file -- it also *rewrites
# kitty.conf* to include it, replacing whatever theme include it finds there
# with `include themes/noctalia.conf`. install.sh symlinks kitty.conf into this
# repo, so the built-in edits a tracked file: the checkout goes dirty on every
# palette change, and a `git pull` on another machine lands in a conflict over
# generated output.
#
# Rendering to a path of our own choosing avoids that completely. kitty.conf
# includes `generated-colors.conf` unconditionally and Noctalia never touches
# it, which is the same arrangement generated-glass.conf already uses.
#
# The double-brace placeholders below are substituted by Noctalia before kitty
# ever sees this. Colour roles and formats are listed at
# https://docs.noctalia.dev/noctalia/theming/templates/

# --- basics -----------------------------------------------------------------

foreground            {{ colors.terminal_foreground.default.hex }}
background            {{ colors.terminal_background.default.hex }}

cursor                {{ colors.terminal_cursor.default.hex }}
cursor_text_color     {{ colors.terminal_background.default.hex }}
cursor_trail_color    {{ colors.terminal_cursor.default.hex }}

# Selection has to stay legible against both, so the foreground is reused and
# only the backing changes -- outline_variant sits just above the background,
# the same role the unfocused window border uses.
selection_foreground  {{ colors.terminal_foreground.default.hex }}
selection_background  {{ colors.outline_variant.default.hex }}

url_color             {{ colors.primary.default.hex }}

# --- 16 ANSI slots ----------------------------------------------------------
#
# The same values terminal-colors.sh pushes into already-open terminals via OSC
# sequences. Both templates render from one palette, so a new window and an old
# one agree.

color0  {{ colors.terminal_normal_black.default.hex }}
color1  {{ colors.terminal_normal_red.default.hex }}
color2  {{ colors.terminal_normal_green.default.hex }}
color3  {{ colors.terminal_normal_yellow.default.hex }}
color4  {{ colors.terminal_normal_blue.default.hex }}
color5  {{ colors.terminal_normal_magenta.default.hex }}
color6  {{ colors.terminal_normal_cyan.default.hex }}
color7  {{ colors.terminal_normal_white.default.hex }}

color8  {{ colors.terminal_bright_black.default.hex }}
color9  {{ colors.terminal_bright_red.default.hex }}
color10 {{ colors.terminal_bright_green.default.hex }}
color11 {{ colors.terminal_bright_yellow.default.hex }}
color12 {{ colors.terminal_bright_blue.default.hex }}
color13 {{ colors.terminal_bright_magenta.default.hex }}
color14 {{ colors.terminal_bright_cyan.default.hex }}
color15 {{ colors.terminal_bright_white.default.hex }}

# --- borders and tabs -------------------------------------------------------
#
# Deliberately the same two roles conf/look.lua and hyprland-colors.lua use for
# Hyprland's window borders, so a kitty split and a tiled window draw their
# focus indication in the same colour.

active_border_color   {{ colors.primary.default.hex }}
inactive_border_color {{ colors.outline_variant.default.hex }}

active_tab_foreground   {{ colors.terminal_background.default.hex }}
active_tab_background   {{ colors.primary.default.hex }}
inactive_tab_foreground {{ colors.terminal_foreground.default.hex }}
inactive_tab_background {{ colors.outline_variant.default.hex }}
