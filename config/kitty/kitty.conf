# kitty -- carried over from the Ubuntu setup.
#
# Two things changed on the way across, both so the colour scheme picker can
# actually reach the terminal:
#
#   * Colours are no longer maintained here. They come from
#     generated-colors.conf, rendered from the active Noctalia palette by the
#     user template in config/noctalia/40-templates.toml -- which is how /theme
#     reaches new terminal windows.
#
#   * `background_opacity` moved into generated-glass.conf, written by
#     bin/noct-glass. That keeps the frosted-glass level in one place instead
#     of hardcoded here and in the Hyprland config separately.
#
# Everything else is yours, unchanged.
#
# Do not enable Noctalia's built-in `kitty` template alongside this file. It
# rewrites kitty.conf to include a path of its own choosing, and install.sh
# symlinks this file, so the built-in edits the repo itself.

kitty_mod ctrl+shift

# Font
#
# The family name has no space in "JetBrainsMono" -- that is how the nerd-fonts
# project names the patched face, and how fontconfig lists it
# (`fc-list : family | grep JetBrains`). fontconfig is forgiving enough to
# resolve the spaced spelling too, but only by falling through its matching
# rules, which is not something to rely on for the font you read all day.
# Package: ttf-jetbrains-mono-nerd.
font_family      JetBrainsMono Nerd Font
font_size 12.0

# Cursor
cursor_shape block
cursor_trail 0

# Padding (why weird value? consistency with foot)
window_margin_width 11.75

# No stupid close confirmation
confirm_os_window_close 0

bell_path none
enable_audio_bell no
update_check_interval 0

hide_window_decorations yes

# Use fish shell
shell fish

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

tab_bar_style powerline
tab_powerline_style round

# Reload config
map kitty_mod+f5 load_config_file

# window and tab keybinds
map kitty_mod+n new_os_window_with_cwd
map kitty_mod+t new_tab_with_cwd
map alt+q close_tab

# Frosted glass. Written by bin/noct-glass; see config/noctalia/glass.conf for
# the levels. Missing until the first render, which kitty tolerates with a
# warning.
#
# This is where a terminal's translucency comes from, and it is NOT the same as
# letting the compositor do it. background_opacity fades the background and
# leaves the glyphs at full strength; Hyprland's active_opacity cannot tell one
# from the other and fades both. Measured 2026-08-19 with `noct-check
# glass-legible`: a window driven entirely from the compositor at 0.60 put
# terminal text at 3.8:1 against its background, under the 4.5:1 readability
# floor. The same visible glassiness supplied by kitty instead leaves the text
# where it started.
#
# dynamic_background_opacity is what lets that level change without restarting
# the terminal -- without it kitty reads background_opacity once at startup and
# ignores it forever after, so every scheme change would leave you with two
# shades of terminal until the last old window was closed. `noct-check
# kitty-live` is the check that this actually works.
dynamic_background_opacity yes
include generated-glass.conf

# Palette. Rendered by Noctalia's user `kitty` template on every scheme change.
# Generated output, so not tracked in this repo -- and absent until the shell
# has rendered a palette once, which kitty likewise only warns about. Last so
# its colours win over anything set above.
include generated-colors.conf
