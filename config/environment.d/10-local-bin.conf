# ~/.config/environment.d/10-local-bin.conf -- read by the systemd USER manager.
#
# The same job as config/uwsm/env, through a different door, and both are here
# on purpose.
#
# config/uwsm/env is read by uwsm, which is how this repo's session is meant to
# start -- greetd offers hyprland-uwsm.desktop and install.sh --login points at
# it. But that is a choice made at the login screen, not a guarantee: pick the
# plain hyprland.desktop session on a machine where both are installed and the
# uwsm env file is never sourced at all. The symptom is not obvious -- every
# launcher provider answers "No results found" and SUPER+SHIFT+G does nothing,
# which is what a working setup with nothing to report also looks like.
#
# This file is read by the systemd user manager itself, so it covers any session
# started as a user unit however it got there. systemd expands $PATH here
# against what the manager already has, which is verified by
# /usr/lib/systemd/user-environment-generators/30-systemd-environment-d-generator.
#
# Belt and braces, and cheap: config/uwsm/env checks before prepending, so
# whichever runs second is a no-op. `noct-check session-path` reads the answer
# off the running shell and does not care which door it came through.
#
# $HOME and not %h: the %-specifiers are a UNIT file feature and environment.d
# does not expand them -- it would prepend a literal "%h/.local/bin" and the
# directory would still not be on PATH. Verified by running the generator:
#
#   /usr/lib/systemd/user-environment-generators/30-systemd-environment-d-generator
#
# which prints the PATH it would set, expanded.
#
# Like the uwsm file, this is read at LOGIN. Changing it needs a new session.
PATH=$HOME/.local/bin:$PATH
